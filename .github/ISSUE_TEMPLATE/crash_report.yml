name: Crash / data loss report
description: The app crashed, hung, or lost map data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If the app still starts, report from inside MMA instead.** Open the map list and click
        "Report bugs here", or go to Settings → Feedback. It attaches the log automatically,
        which for a crash is the thing that actually matters.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Include what you were doing when it occurred.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.11.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Attach or paste contents of `%LOCALAPPDATA%\app.map-making.local\logs\mma.log`
      render: text
    validations:
      required: true

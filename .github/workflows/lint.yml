name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-legacy and check-floors read mma.d.ts out of release tags.
          fetch-depth: 0
      - name: Fetch upstream SDK release history
        # API.md derives historical version annotations from upstream release tags.
        run: git fetch --no-tags https://github.com/ccmdi/mma.git 'refs/tags/v*:refs/tags/v*'
      - uses: ./.github/actions/setup
      - uses: actions/cache@v5
        with:
          path: app/node_modules/.vitest-cache
          key: ${{ runner.os }}-node-gates-v1-${{ hashFiles('app/package-lock.json', 'plugins/**/package-lock.json', '.nvmrc', 'app/vitest.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-gates-v1-${{ hashFiles('app/package-lock.json', 'plugins/**/package-lock.json', '.nvmrc', 'app/vitest.config.ts') }}-
      - run: sh scripts/gates.sh --env node
        env:
          GATES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          rust: true
      - run: sh scripts/gates.sh --env rust

name: Build MMA-CN Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugins/*/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: mma-cn-windows-x64

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Build plugin artifacts
        run: node plugins/build-all.mjs

      - name: Create production environment
        shell: pwsh
        env:
          PETAL_MAP_KEY: ${{ secrets.VITE_PETAL_MAP_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PETAL_MAP_KEY)) {
            throw "Repository secret VITE_PETAL_MAP_KEY is missing."
          }
          Set-Content -Path app/.env.production.local -Value ('VITE_PETAL_MAP_KEY="' + $env:PETAL_MAP_KEY + '"') -NoNewline

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MMA-CN-windows-x64
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

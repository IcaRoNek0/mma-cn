name: Build MMA-CN macOS Apple Silicon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugins/*/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: mma-cn-macos-arm64
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build plugin artifacts
        run: node plugins/build-all.mjs
      - name: Build application
        working-directory: app
        env:
          VITE_PETAL_MAP_KEY: ${{ secrets.VITE_PETAL_MAP_KEY }}
        run: |
          test -n "$VITE_PETAL_MAP_KEY" || { echo 'VITE_PETAL_MAP_KEY secret is missing'; exit 1; }
          npm exec tauri build -- --target aarch64-apple-darwin --bundles app --features web-serve
      - name: Package application
        run: |
          app=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MMA-CN.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" MMA-CN-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MMA-CN-macos-arm64
          path: MMA-CN-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
